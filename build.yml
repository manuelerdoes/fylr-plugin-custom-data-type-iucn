# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin

server:
  install:
    - server
    - l10n

webfrontend:
  # assembled into plugin.webfrontend.url, in this order:
  # .coffee is compiled (CoffeeScript 1.x), .scss compiled,
  # anything else taken verbatim
  bundles:
    - sources:
        - webfrontend/IUCNUtil.coffee
        - webfrontend/CustomDataTypeIUCN.coffee
        - webfrontend/CustomBaseConfigIUCN.coffee
  scss:
    - webfrontend/custom-data-type-iucn.scss
  # the webfrontend loads its loca as per-culture JSONs, generated from the CSV
  l10n_json:
    - csv: l10n/custom-data-type-iucn.csv
  install:
    - webfrontend/image

loca:
  # mastered in the custom-data-types Google Sheet
  - csv: l10n/custom-data-type-iucn.csv
    sheet: 1Z3UPJ6XqLBp-P8SUf-ewq4osNJ3iZWKJB83tc6Wrfn0
    gid: "1058658585"
